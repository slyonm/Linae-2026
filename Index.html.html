<style>
  :root{

    --line:#2a3f5c;
    --gold:#e8b34c;
    --gold-dim:#a97f31;
    --green:#4fbf82;
    --red:#e2685f;
    --text:#edeff3;
    --muted:#8aa0bc;
    --muted-2:#5f7a9c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-950);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  h1,h2,h3,.num,.tab-label,.court-tag{
    font-family:'Oswald',sans-serif;
  }
  /* Header */
  .topbar{
    background:linear-gradient(180deg,var(--navy-900),var(--navy-950));
    border-bottom:1px solid var(--line);
    padding:22px 16px 16px;
    position:sticky; top:0; z-index:20;
  }
  .brand-row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .brand-mark{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:22px;
    letter-spacing:0.5px; color:var(--gold);
  }
  .brand-sub{color:var(--muted); font-size:13px;}
  .brand-place{color:var(--muted-2,#5f7a9c); font-size:12.5px; margin-top:4px;}

  /* Category tabs */
  .tabs{
    display:flex; gap:8px; margin-top:16px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--navy-800);
    color:var(--muted);
    font-family:'Oswald',sans-serif;
    font-size:13.5px;
    letter-spacing:0.3px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tab.active{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--navy-950);
    font-weight:600;
  }

  .wrap{max-width:720px; margin:0 auto; padding:0 14px;}
  .cat-head{padding:18px 0 6px;}
  .cat-title{font-size:20px; font-weight:600; margin:0;}
  .cat-venue{color:var(--muted); font-size:13px; margin-top:3px;}

  /* Section nav within category */
  .subnav{display:flex; gap:6px; margin:14px 0 10px;}
  .subbtn{
    flex:1;
    text-align:center;
    padding:8px 6px;
    border-radius:7px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    font-size:12.5px;
    font-family:'Oswald',sans-serif;
    letter-spacing:0.4px;
    cursor:pointer;
  }
  .subbtn.active{background:var(--navy-700); color:var(--text); border-color:var(--navy-600);}

  /* Standings */
  .group-block{margin-bottom:18px;}
  .group-title{
    font-size:13px; color:var(--gold); font-weight:600; margin:0 0 6px;
    display:flex; align-items:center; gap:8px;
  }
  .group-title .line{flex:1; height:1px; background:var(--line);}
  table.standings{
    width:100%; border-collapse:collapse; font-size:12.5px;
    background:var(--navy-800); border-radius:8px; overflow:hidden;
  }
  table.standings th{
    background:var(--navy-700); color:var(--muted); font-weight:500;
    padding:7px 4px; text-align:center; font-size:10.5px; letter-spacing:0.2px;
  }
  table.standings th:first-child, table.standings td:first-child{
    text-align:left; padding-left:9px;
  }
  table.standings td{padding:7px 4px; text-align:center; border-top:1px solid var(--navy-700);}
  table.standings td.team{font-size:12px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  table.standings td.pts{color:var(--gold); font-weight:700; font-family:'Oswald',sans-serif;}
  table.standings tr.qualify td.team{color:var(--green);}

  .copa-tables{display:flex; flex-direction:column; gap:16px; margin-top:6px;}
  .copa-label{
    display:inline-block; font-size:11px; font-family:'Oswald',sans-serif;
    letter-spacing:0.5px; padding:3px 9px; border-radius:20px; margin-bottom:7px;
  }
  .copa-ORO{background:rgba(232,179,76,0.16); color:var(--gold);}
  .copa-PLATA{background:rgba(180,190,205,0.16); color:#c7d1de;}
  .copa-BRONCE{background:rgba(198,120,80,0.18); color:#d99567;}

  /* Schedule */
  .day-block{margin-bottom:16px;}
  .day-title{
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.5px;
    color:var(--text); background:var(--navy-800); padding:7px 10px;
    border-radius:7px; margin-bottom:8px; border-left:3px solid var(--gold);
  }
  .match-card{
    background:var(--navy-800);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 11px;
    margin-bottom:8px;
  }
  .match-meta{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; color:var(--muted); margin-bottom:8px;
  }
  .match-meta .time{font-family:'Oswald',sans-serif; color:var(--text); font-size:13px;}
  .court-tag{
    background:var(--navy-700); color:var(--muted); font-size:10.5px;
    padding:2px 8px; border-radius:5px; letter-spacing:0.3px;
  }
  .copa-chip{font-size:10px; padding:2px 7px; border-radius:5px; letter-spacing:0.4px;}
  .teams-row{display:flex; align-items:center; gap:8px;}
  .team-col{flex:1; min-width:0;}
  .team-name{
    font-size:13.5px; line-height:1.25;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .team-name.placeholder{color:var(--muted); font-style:italic; font-size:12.5px;}
  .team-name.winner{color:var(--green); font-weight:600;}
  .score-col{display:flex; align-items:center; gap:5px;}
  .score-input{
    width:34px; height:34px;
    background:var(--navy-950);
    border:1px solid var(--line);
    border-radius:7px;
    color:var(--text);
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-size:15px;
    -moz-appearance:textfield;
  }
  .score-input:focus{outline:none; border-color:var(--gold);}
  .score-input::-webkit-outer-spin-button, .score-input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .vs-label{color:var(--muted-2,#5f7a9c); font-size:11px; padding:0 2px;}
  .manual-input{
    width:100%; background:transparent; border:none; border-bottom:1px dashed var(--muted-2,#5f7a9c);
    color:var(--muted); font-size:12.5px; font-style:italic; padding:2px 0;
  }
  .manual-input:focus{outline:none; border-bottom-color:var(--gold); color:var(--text);}
  .pending-tag{font-size:9.5px; color:var(--muted-2,#5f7a9c); margin-top:5px;}

  .info-note{
    font-size:12px; color:var(--muted); background:var(--navy-800);
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:12px 0 18px;
    line-height:1.5;
  }
  .info-note b{color:var(--gold); font-weight:600;}
  .sync-note{
    font-size:11px; color:var(--muted-2,#5f7a9c); text-align:center; margin-top:6px;
  }
  .save-flash{color:var(--green);}
</style>

async function saveScore(matchId, h, a){
  scores[matchId] = {h,a};
  if(db){
    try{ await setDoc(doc(db, SCORES_COLLECTION, matchId), {h, a, updatedAt: Date.now()}); }
    catch(e){ console.error('save failed', e); }
  } else {
    try{ localStorage.setItem('linaes2026:'+matchId, JSON.stringify({h,a})); }catch(e){}
  }
}

function startRealtimeSync(){
  if(db){
    onSnapshot(collection(db, SCORES_COLLECTION), (snap)=>{
      snap.docChanges().forEach(change=>{
        const d = change.doc.data();
        scores[change.doc.id] = {h:d.h, a:d.a};
      });
      firestoreReady = true;
      render();
    }, (err)=>{
      console.error('Storage list failed:', err);
      document.getElementById('syncNote').textContent = 'No se pudo conectar a la base de datos. Revisa la configuración de Firebase y las reglas de Firestore.';
      firestoreReady = true;
      render();
    });
  } else {
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('linaes2026:')===0){
          scores[k.slice('linaes2026:'.length)] = JSON.parse(localStorage.getItem(k));
        }
      }
    }catch(e){}
    firestoreReady = true;
  }
}


// ---------- STANDINGS HELPERS ----------
function emptyRow(team){ return {team, pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0}; }

function computeGroupTable(cat, groupName){
  const teams = cat.groups[groupName];
  const table = {};
  teams.forEach(t=> table[t]=emptyRow(t));
  cat.matches.forEach(m=>{
    if(m.phase!=='grupos' || m.group!==groupName) return;
    const s = scores[m.id];
    if(!s || s.h===undefined || s.a===undefined || s.h===null || s.a===null || s.h==='' || s.a==='') return;
    const h = Number(s.h), a = Number(s.a);
    if(isNaN(h)||isNaN(a)) return;
    const rh = table[m.home], ra = table[m.away];
    if(!rh || !ra) return;
    rh.pj++; ra.pj++;
    rh.gf+=h; rh.gc+=a; ra.gf+=a; ra.gc+=h;
    if(h>a){ rh.pg++; rh.pts+=3; ra.pp++; }
    else if(h<a){ ra.pg++; ra.pts+=3; rh.pp++; }
    else { rh.pe++; ra.pe++; rh.pts+=1; ra.pts+=1; }
  });
  const rows = teams.map(t=>table[t]);
  rows.sort((x,y)=> y.pts-x.pts || (y.gf-y.gc)-(x.gf-x.gc) || y.gf-x.gf || x.team.localeCompare(y.team));
  return rows;
}

function getScore(m){
  const s = scores[m.id];
  if(!s) return null;
  if(s.h===undefined||s.a===undefined||s.h===null||s.a===null||s.h===''||s.a==='') return null;
  const h=Number(s.h), a=Number(s.a);
  if(isNaN(h)||isNaN(a)) return null;
  return {h,a};
}

// Resolve a slot descriptor to {name, known} using the standings context of a category
function resolveSlot(cat, slot, ctx){
  if(typeof slot==='string') return {name:slot, known:true};
  if(slot.g){
    const rows = ctx.groupTables[slot.g];
    const row = rows && rows[slot.p-1];
    return row ? {name:row.team, known:true} : {name: slot.p+'° '+slot.g, known:false};
  }
  if(slot.gen){
    const row = ctx.general && ctx.general[slot.gen-1];
    return row ? {name:row.team, known:true} : {name: slot.gen+'° General', known:false};
  }
  if(slot.mini){
    const row = ctx.groupTables['General'] && ctx.groupTables['General'][slot.mini-1];
    return row ? {name:row.team, known:true} : {name: slot.mini+'° lugar', known:false};
  }
  if(slot.copaRank){
    const rows = ctx.copaTables && ctx.copaTables[slot.copaRank];
    const row = rows && rows[slot.pos-1];
    return row ? {name:row.team, known:true} : {name: slot.pos+'° Copa '+cap(slot.copaRank), known:false};
  }
  if(slot.agg){
    const pairInfo = ctx.aggregates && ctx.aggregates[slot.agg];
    if(pairInfo && pairInfo.decided){
      const name = slot.side==='W' ? pairInfo.winner : pairInfo.loser;
      return {name, known:true};
    }
    const label = slot.side==='W' ? 'Ganador semifinal' : 'Perdedor semifinal';
    return {name: label, known:false};
  }
  return {name:'?', known:false};
}
function cap(s){ return s.charAt(0)+s.slice(1).toLowerCase(); }

// Build the full resolution context for a category
function buildContext(cat){
  const ctx = {groupTables:{}};
  Object.keys(cat.groups).forEach(g=>{ ctx.groupTables[g] = computeGroupTable(cat, g); });

  if(cat.hasGeneral){
    // merge 3 groups: all 1st places ranked together, then all 2nd places, etc.
    const groupNames = Object.keys(cat.groups);
    const general = [];
    for(let pos=0; pos<4; pos++){
      const bucket = groupNames.map(g=> ctx.groupTables[g][pos]).filter(Boolean);
      bucket.sort((x,y)=> y.pts-x.pts || (y.gf-y.gc)-(x.gf-x.gc) || y.gf-x.gf);
      general.push(...bucket);
    }
    ctx.general = general;
  }

  if(cat.hasCopa){
    ['ORO','PLATA'].forEach(copa=>{
      const groupNames = Object.keys(cat.groups);
      const posSet = copa==='ORO' ? [1,2] : [3,4];
      const teamNames = [];
      groupNames.forEach(g=> posSet.forEach(p=>{
        const row = ctx.groupTables[g][p-1];
        if(row) teamNames.push(row.team);
      }));
      const table = {};
      teamNames.forEach(t=> table[t]=emptyRow(t));
      cat.matches.forEach(m=>{
        if(m.copa!==copa) return;
        if(m.phase==='llave' && m.label && (m.label.indexOf('Definición')>=0 || m.label.indexOf('Final')>=0 || m.label.indexOf('FINAL')>=0)) return;
        const homeR = resolveSlot(cat, m.home, ctx);
        const awayR = resolveSlot(cat, m.away, ctx);
        if(!homeR.known || !awayR.known) return;
        if(!(homeR.name in table) || !(awayR.name in table)) return;
        const sc = getScore(m);
        if(!sc) return;
        const rh=table[homeR.name], ra=table[awayR.name];
        rh.pj++; ra.pj++;
        rh.gf+=sc.h; rh.gc+=sc.a; ra.gf+=sc.a; ra.gc+=sc.h;
        if(sc.h>sc.a){ rh.pg++; rh.pts+=3; ra.pp++; }
        else if(sc.h<sc.a){ ra.pg++; ra.pts+=3; rh.pp++; }
        else { rh.pe++; ra.pe++; rh.pts+=1; ra.pts+=1; }
      });
      // also count the original group-stage match between the paired teams (already in group table,
      // but re-derive here from the raw group match so the copa mini-table is self-consistent)
      const rows = teamNames.map(t=>table[t]);
      rows.sort((x,y)=> y.pts-x.pts || (y.gf-y.gc)-(x.gf-x.gc) || y.gf-x.gf || x.team.localeCompare(y.team));
      ctx.copaTables = ctx.copaTables || {};
      ctx.copaTables[copa] = rows;
    });
  }

  if(cat.hasGeneral){
    // aggregate two-legged semifinals for Mini B
    ctx.aggregates = {};
    const pairs = {};
    cat.matches.forEach(m=>{
      if(m.phase==='llave' && m.pair){
        pairs[m.pair] = pairs[m.pair] || [];
        pairs[m.pair].push(m);
      }
    });
    Object.keys(pairs).forEach(pairId=>{
      const legs = pairs[pairId];
      const homeR = resolveSlot(cat, legs[0].home, ctx);
      const awayR = resolveSlot(cat, legs[0].away, ctx);
      let sumH=0, sumA=0, legsPlayed=0;
      legs.forEach(m=>{
        const sc = getScore(m);
        if(sc){ sumH+=sc.h; sumA+=sc.a; legsPlayed++; }
      });
      const decided = legsPlayed===legs.length && legs.length>0 && sumH!==sumA;
      ctx.aggregates[pairId] = {
        home:homeR.name, away:awayR.name,
        sumH, sumA, legsPlayed, totalLegs:legs.length,
        decided,
        winner: decided ? (sumH>sumA?homeR.name:awayR.name) : null,
        loser: decided ? (sumH>sumA?awayR.name:homeR.name) : null,
      };
    });
  }

  return ctx;
}

  let html='';
  days.forEach(day=>{
    html += `<div class="day-block"><div class="day-title">${day}</div>`;
    cat.matches.filter(m=>m.day===day).forEach(m=>{
      html += matchCard(cat, m, ctx);
    });
    html += `</div>`;
  });
  contentEl.innerHTML = html;
  wireInputs(cat, ctx);
}

function renderLlaves(cat, ctx){
  const llaveMatches = cat.matches.filter(m=>m.phase==='llave');
  const days = [...new Set(llaveMatches.map(m=>m.day))];
  let html='';
  days.forEach(day=>{
    html += `<div class="day-block"><div class="day-title">${day}</div>`;
    llaveMatches.filter(m=>m.day===day).forEach(m=>{
      html += matchCard(cat, m, ctx);
    });
    html += `</div>`;
  });
  if(!llaveMatches.length) html = '<p class="info-note">Esta categoría no tiene fase de llaves.</p>';
  contentEl.innerHTML = html;
  wireInputs(cat, ctx);
}

function matchCard(cat, m, ctx){
  const homeR = resolveSlot(cat, m.home, ctx);
  const awayR = resolveSlot(cat, m.away, ctx);
  const sc = getScore(m);
  const hVal = sc ? sc.h : (scores[m.id]&&scores[m.id].h!=null?scores[m.id].h:'');
  const aVal = sc ? sc.a : (scores[m.id]&&scores[m.id].a!=null?scores[m.id].a:'');
  const winnerH = sc && sc.h>sc.a;
  const winnerA = sc && sc.a>sc.h;
  const copaChip = m.copa ? `<span class="copa-chip copa-${m.copa}">${cap(m.copa)}</span>` : '';
  const label = m.label ? `<span style="color:var(--muted); font-size:11px;">${escapeHtml(m.label)}</span>` : '';

  return `<div class="match-card">
    <div class="match-meta">
      <span class="time">${m.time}</span>
      <span class="court-tag">${m.court}</span>
      ${copaChip}
    </div>
    ${label?`<div style="margin-bottom:6px;">${label}</div>`:''}
    <div class="teams-row">
      <div class="team-col">
        <div class="team-name ${!homeR.known?'placeholder':''} ${winnerH?'winner':''}">${escapeHtml(homeR.name)}</div>
      </div>
      <div class="score-col">
        <input type="number" min="0" class="score-input" data-match="${m.id}" data-side="h" value="${hVal}" placeholder="-">
        <span class="vs-label">–</span>
        <input type="number" min="0" class="score-input" data-match="${m.id}" data-side="a" value="${aVal}" placeholder="-">
      </div>
      <div class="team-col" style="text-align:right;">
        <div class="team-name ${!awayR.known?'placeholder':''} ${winnerA?'winner':''}" style="margin-left:auto;">${escapeHtml(awayR.name)}</div>
      </div>
    </div>
    ${(!homeR.known || !awayR.known) ? `<div class="pending-tag">Se completa automáticamente cuando estén los resultados previos</div>`:''}
  </div>`;
}

function wireInputs(cat, ctx){
  contentEl.querySelectorAll('.score-input').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const matchId = e.target.dataset.match;
      const side = e.target.dataset.side;
      const cur = scores[matchId] || {h:'',a:''};
      const v = e.target.value;
      const next = {...cur, [side]: v===''? '' : Number(v)};
      await saveScore(matchId, next.h, next.a);
      render();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ---------- INIT ----------
(function init(){
  contentEl.innerHTML = '<p class="info-note">Conectando…</p>';
  startRealtimeSync();
  render();
})();
</script>
</body>
</html>
