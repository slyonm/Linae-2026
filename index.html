<style>
  :root{

    --line:#2a3f5c;
    --gold:#e8b34c;
    --gold-dim:#a97f31;
    --green:#4fbf82;
    --red:#e2685f;
    --text:#edeff3;
    --muted:#8aa0bc;
    --muted-2:#5f7a9c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy-950);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  h1,h2,h3,.num,.tab-label,.court-tag{
    font-family:'Oswald',sans-serif;
  }
  /* Header */
  .topbar{
    background:linear-gradient(180deg,var(--navy-900),var(--navy-950));
    border-bottom:1px solid var(--line);
    padding:22px 16px 16px;
    position:sticky; top:0; z-index:20;
  }
  .brand-row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .brand-mark{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:22px;
    letter-spacing:0.5px; color:var(--gold);
  }
  .brand-sub{color:var(--muted); font-size:13px;}
  .brand-place{color:var(--muted-2,#5f7a9c); font-size:12.5px; margin-top:4px;}

  /* Category tabs */
  .tabs{
    display:flex; gap:8px; margin-top:16px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--navy-800);
    color:var(--muted);
    font-family:'Oswald',sans-serif;
    font-size:13.5px;
    letter-spacing:0.3px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tab.active{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--navy-950);
    font-weight:600;
  }

  .wrap{max-width:720px; margin:0 auto; padding:0 14px;}
  .cat-head{padding:18px 0 6px;}
  .cat-title{font-size:20px; font-weight:600; margin:0;}
  .cat-venue{color:var(--muted); font-size:13px; margin-top:3px;}

  /* Section nav within category */
  .subnav{display:flex; gap:6px; margin:14px 0 10px;}
  .subbtn{
    flex:1;
    text-align:center;
    padding:8px 6px;
    border-radius:7px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    font-size:12.5px;
    font-family:'Oswald',sans-serif;
    letter-spacing:0.4px;
    cursor:pointer;
  }
  .subbtn.active{background:var(--navy-700); color:var(--text); border-color:var(--navy-600);}

  /* Standings */
  .group-block{margin-bottom:18px;}
  .group-title{
    font-size:13px; color:var(--gold); font-weight:600; margin:0 0 6px;
    display:flex; align-items:center; gap:8px;
  }
  .group-title .line{flex:1; height:1px; background:var(--line);}
  table.standings{
    width:100%; border-collapse:collapse; font-size:12.5px;
    background:var(--navy-800); border-radius:8px; overflow:hidden;
  }
  table.standings th{
    background:var(--navy-700); color:var(--muted); font-weight:500;
    padding:7px 4px; text-align:center; font-size:10.5px; letter-spacing:0.2px;
  }
  table.standings th:first-child, table.standings td:first-child{
    text-align:left; padding-left:9px;
  }
  table.standings td{padding:7px 4px; text-align:center; border-top:1px solid var(--navy-700);}
  table.standings td.team{font-size:12px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  table.standings td.pts{color:var(--gold); font-weight:700; font-family:'Oswald',sans-serif;}
  table.standings tr.qualify td.team{color:var(--green);}

  .copa-tables{display:flex; flex-direction:column; gap:16px; margin-top:6px;}
  .copa-label{
    display:inline-block; font-size:11px; font-family:'Oswald',sans-serif;
    letter-spacing:0.5px; padding:3px 9px; border-radius:20px; margin-bottom:7px;
  }
  .copa-ORO{background:rgba(232,179,76,0.16); color:var(--gold);}
  .copa-PLATA{background:rgba(180,190,205,0.16); color:#c7d1de;}
  .copa-BRONCE{background:rgba(198,120,80,0.18); color:#d99567;}

  /* Schedule */
  .day-block{margin-bottom:16px;}
  .day-title{
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.5px;
    color:var(--text); background:var(--navy-800); padding:7px 10px;
    border-radius:7px; margin-bottom:8px; border-left:3px solid var(--gold);
  }
  .match-card{
    background:var(--navy-800);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 11px;
    margin-bottom:8px;
  }
  .match-meta{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; color:var(--muted); margin-bottom:8px;
  }
  .match-meta .time{font-family:'Oswald',sans-serif; color:var(--text); font-size:13px;}
  .court-tag{
    background:var(--navy-700); color:var(--muted); font-size:10.5px;
    padding:2px 8px; border-radius:5px; letter-spacing:0.3px;
  }
  .copa-chip{font-size:10px; padding:2px 7px; border-radius:5px; letter-spacing:0.4px;}
  .result-tag{
    margin-left:auto;
    font-family:'Oswald',sans-serif; font-size:14px; color:var(--gold);
    background:var(--navy-700); padding:2px 9px; border-radius:6px;
  }
  .teams-header{
    display:flex; align-items:center; gap:8px; margin-bottom:9px;
  }
  .teams-header .team-name{flex:1; font-size:13.5px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .vs-mid{color:var(--muted-2); font-size:10.5px; flex:0 0 auto;}
  .team-name.placeholder{color:var(--muted); font-style:italic; font-size:12.5px;}
  .team-name.winner{color:var(--green); font-weight:600;}
  .sets-block{display:flex; flex-direction:column; gap:6px;}
  .set-row{display:flex; align-items:center; gap:7px;}
  .set-label{
    flex:1; font-family:'Oswald',sans-serif; font-size:12px; color:var(--muted);
    display:flex; align-items:baseline; gap:5px;
  }
  .set-max{font-size:9.5px; color:var(--muted-2); font-family:'Inter',sans-serif;}
  .score-input{
    width:38px; height:32px;
    background:var(--navy-950);
    border:1px solid var(--line);
    border-radius:7px;
    color:var(--text);
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-size:14px;
    -moz-appearance:textfield;
  }
  .score-input.set-won{border-color:var(--green); color:var(--green);}
  .score-input:focus{outline:none; border-color:var(--gold);}
  .score-input::-webkit-outer-spin-button, .score-input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .vs-label{color:var(--muted-2); font-size:11px; padding:0 1px;}
  .pending-tag{font-size:9.5px; color:var(--muted-2); margin-top:7px;}

  .info-note{
    font-size:12px; color:var(--muted); background:var(--navy-800);
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:12px 0 18px;

  }
  .info-note b{color:var(--gold); font-weight:600;}
  .sync-note{
    font-size:11px; color:var(--muted-2,#5f7a9c); text-align:center; margin-top:6px;

  .save-flash{color:var(--green);}

const scores = {};

// ---------- REGLAS DE VÓLEY ----------
// Cada set lo gana quien tenga más puntos (set 1 y 2 a 25, set 3 a 15).
// El partido lo gana el primero en ganar 2 sets. Sistema de puntos de tabla:
// gana 2-0 -> 3 pts / gana 2-1 -> 2 pts / pierde 1-2 -> 1 pt / pierde 0-2 -> 0 pts
function setWinner(set){
  if(!set) return null;
  const h = set.h, a = set.a;
  if(h===undefined||a===undefined||h===null||a===null||h===''||a==='') return null;
  const hn = Number(h), an = Number(a);
  if(isNaN(hn)||isNaN(an) || hn===an) return null;
  return hn>an ? 'h' : 'a';
}

// Resume un partido a partir de los sets guardados.
// Devuelve null si el partido todavía no está decidido (nadie llegó a 2 sets ganados).
function matchResult(matchId){
  const s = scores[matchId];
  if(!s) return null;
  const sets = [s.s1, s.s2, s.s3].filter(Boolean);
  let hSets=0, aSets=0;
  const setScores = [];
  [s.s1, s.s2, s.s3].forEach(set=>{
    const w = setWinner(set);
    if(w==='h') hSets++;
    else if(w==='a') aSets++;
    if(set && w) setScores.push({h:Number(set.h), a:Number(set.a)});
  });
  if(hSets<2 && aSets<2) return null; // aún no termina
  let hPts=0, aPts=0;
  setScores.forEach(sc=>{ hPts+=sc.h; aPts+=sc.a; });
  const winner = hSets>aSets ? 'h' : 'a';
  const loserSets = winner==='h' ? aSets : hSets;
  // 3-2-1-0
  let winnerTablePts, loserTablePts;
  if(loserSets===0){ winnerTablePts=3; loserTablePts=0; }
  else { winnerTablePts=2; loserTablePts=1; }
  return {
    hSets, aSets, hPts, aPts, winner,
    tablePts: { h: winner==='h'?winnerTablePts:loserTablePts, a: winner==='a'?winnerTablePts:loserTablePts }
  };
}

// ---------- STANDINGS HELPERS ----------
function emptyRow(team){ return {team, pj:0,pg:0,pp:0, sg:0,sp:0, ptg:0,ptp:0, pts:0}; }

function applyResult(rowH, rowA, res){
  rowH.pj++; rowA.pj++;
  rowH.sg+=res.hSets; rowH.sp+=res.aSets;
  rowA.sg+=res.aSets; rowA.sp+=res.hSets;
  rowH.ptg+=res.hPts; rowH.ptp+=res.aPts;
  rowA.ptg+=res.aPts; rowA.ptp+=res.hPts;
  rowH.pts+=res.tablePts.h; rowA.pts+=res.tablePts.a;
  if(res.winner==='h'){ rowH.pg++; rowA.pp++; } else { rowA.pg++; rowH.pp++; }
}

function sortStandings(rows){
  rows.sort((x,y)=>
    y.pts-x.pts ||
    (y.sg-y.sp)-(x.sg-x.sp) ||
    (y.ptg-y.ptp)-(x.ptg-x.ptp) ||
    x.team.localeCompare(y.team)
  );
  return rows;
}

function computeGroupTable(cat, groupName){
  const teams = cat.groups[groupName];
  const table = {};
  teams.forEach(t=> table[t]=emptyRow(t));
  cat.matches.forEach(m=>{
    if(m.phase!=='grupos' || m.group!==groupName) return;
    const res = matchResult(m.id);
    if(!res) return;
    const rh = table[m.home], ra = table[m.away];
    if(!rh || !ra) return;
    applyResult(rh, ra, res);
  });
  return sortStandings(teams.map(t=>table[t]));
}

// Resolve a slot descriptor to {name, known} using the standings context of a category
function resolveSlot(cat, slot, ctx){
  if(typeof slot==='string') return {name:slot, known:true};
  if(slot.g){
    const rows = ctx.groupTables[slot.g];
    const row = rows && rows[slot.p-1];
    return row ? {name:row.team, known:true} : {name: slot.p+'° '+slot.g, known:false};
  }
  if(slot.gen){
    const row = ctx.general && ctx.general[slot.gen-1];
    return row ? {name:row.team, known:true} : {name: slot.gen+'° General', known:false};
  }
  if(slot.mini){
    const row = ctx.groupTables['General'] && ctx.groupTables['General'][slot.mini-1];
    return row ? {name:row.team, known:true} : {name: slot.mini+'° lugar', known:false};
  }
  if(slot.copaRank){
    const rows = ctx.copaTables && ctx.copaTables[slot.copaRank];
    const row = rows && rows[slot.pos-1];
    return row ? {name:row.team, known:true} : {name: slot.pos+'° Copa '+cap(slot.copaRank), known:false};
  }
  if(slot.agg){
    const pairInfo = ctx.aggregates && ctx.aggregates[slot.agg];
    if(pairInfo && pairInfo.decided){
      const name = slot.side==='W' ? pairInfo.winner : pairInfo.loser;
      return {name, known:true};
    }
    const label = slot.side==='W' ? 'Ganador semifinal' : 'Perdedor semifinal';
    return {name: label, known:false};
  }
  return {name:'?', known:false};
}
function cap(s){ return s.charAt(0)+s.slice(1).toLowerCase(); }

// Build the full resolution context for a category
function buildContext(cat){
  const ctx = {groupTables:{}};
  Object.keys(cat.groups).forEach(g=>{ ctx.groupTables[g] = computeGroupTable(cat, g); });

  if(cat.hasGeneral){
    // merge 3 groups: all 1st places ranked together, then all 2nd places, etc.
    const groupNames = Object.keys(cat.groups);
    const general = [];
    for(let pos=0; pos<4; pos++){
      const bucket = groupNames.map(g=> ctx.groupTables[g][pos]).filter(Boolean);
      sortStandings(bucket);
      general.push(...bucket);
    }
    ctx.general = general;
  }

  if(cat.hasCopa){
    ['ORO','PLATA'].forEach(copa=>{
      const groupNames = Object.keys(cat.groups);
      const posSet = copa==='ORO' ? [1,2] : [3,4];
      const teamNames = [];
      groupNames.forEach(g=> posSet.forEach(p=>{
        const row = ctx.groupTables[g][p-1];
        if(row) teamNames.push(row.team);
      }));
      const table = {};
      teamNames.forEach(t=> table[t]=emptyRow(t));
      cat.matches.forEach(m=>{
        if(m.copa!==copa) return;
        if(m.phase==='llave' && m.label && (m.label.indexOf('Definición')>=0 || m.label.indexOf('Final')>=0 || m.label.indexOf('FINAL')>=0)) return;
        const homeR = resolveSlot(cat, m.home, ctx);
        const awayR = resolveSlot(cat, m.away, ctx);
        if(!homeR.known || !awayR.known) return;
        if(!(homeR.name in table) || !(awayR.name in table)) return;
        const res = matchResult(m.id);
        if(!res) return;
        applyResult(table[homeR.name], table[awayR.name], res);
      });
      ctx.copaTables = ctx.copaTables || {};
      ctx.copaTables[copa] = sortStandings(teamNames.map(t=>table[t]));
    });
  }

  if(cat.hasGeneral){
    // aggregate two-legged semifinals for Mini B: gana quien sume más partidos
    // ganados en las dos fechas; si queda 1-1, desempata por sets y luego por puntos.
    ctx.aggregates = {};
    const pairs = {};
    cat.matches.forEach(m=>{
      if(m.phase==='llave' && m.pair){
        pairs[m.pair] = pairs[m.pair] || [];
        pairs[m.pair].push(m);
      }
    });
    Object.keys(pairs).forEach(pairId=>{
      const legs = pairs[pairId];
      const homeR = resolveSlot(cat, legs[0].home, ctx);
      const awayR = resolveSlot(cat, legs[0].away, ctx);
      let homeWins=0, awayWins=0, homeSets=0, awaySets=0, homePts=0, awayPts=0, legsDecided=0;
      legs.forEach(m=>{
        const res = matchResult(m.id);
        if(!res) return;
        legsDecided++;
        if(res.winner==='h'){ homeWins++; } else { awayWins++; }
        homeSets+=res.hSets; awaySets+=res.aSets;
        homePts+=res.hPts; awayPts+=res.aPts;
      });
      const decided = legsDecided===legs.length && legs.length>0 && (
        homeWins!==awayWins || homeSets!==awaySets || homePts!==awayPts
      );
      let homeIsWinner = null;
      if(decided){
        if(homeWins!==awayWins) homeIsWinner = homeWins>awayWins;
        else if(homeSets!==awaySets) homeIsWinner = homeSets>awaySets;
        else homeIsWinner = homePts>awayPts;
      }
      ctx.aggregates[pairId] = {
        home:homeR.name, away:awayR.name,
        legsDecided, totalLegs:legs.length,
        decided,
        winner: decided ? (homeIsWinner?homeR.name:awayR.name) : null,
        loser: decided ? (homeIsWinner?awayR.name:homeR.name) : null,
      };
    });
  }

  return ctx;
}

function standingsTableHtml(rows, highlightTop){
  let html = `<table class="standings"><thead><tr>
    <th>Equipo</th><th>PJ</th><th>G</th><th>P</th><th>SG</th><th>SP</th><th>Pts</th>
  </tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const qualifies = highlightTop && i<highlightTop;
    html += `<tr class="${qualifies?'qualify':''}">
      <td class="team">${i+1}. ${escapeHtml(r.team)}</td>
      <td>${r.pj}</td><td>${r.pg}</td><td>${r.pp}</td>
      <td>${r.sg}</td><td>${r.sp}</td><td class="pts">${r.pts}</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function renderTabla(cat, ctx){
  let html = '';
  Object.keys(cat.groups).forEach(g=>{
    const rows = ctx.groupTables[g];
    html += `<div class="group-block">
      <div class="group-title">${g==='General'?'Clasificación':g}<span class="line"></span></div>
      ${standingsTableHtml(rows, cat.hasCopa ? 2 : 0)}
    </div>`;
  });

  if(cat.hasCopa){
    html += `<div class="copa-tables">`;
    ['ORO','PLATA'].forEach(copa=>{
      html += `<div class="group-block">
        <span class="copa-label copa-${copa}">Copa ${cap(copa)}</span>
        ${standingsTableHtml(ctx.copaTables[copa], 0)}
      </div>`;
    });
    html += `</div>`;
    html += `<p class="info-note"><b>Cómo se arma:</b> la Copa Oro combina a los 2 primeros de cada grupo y la Copa Plata a los puestos 3° y 4°. Se calcula con el partido de grupos entre ellos más los cruces Oro/Plata. La final y el 3er/4to lugar se completan solos apenas hay resultados suficientes.</p>`;
  }
  if(cat.hasGeneral){
    const general = ctx.general;
    html += `<div class="group-block">
      <div class="group-title">Clasificación General (12 equipos)<span class="line"></span></div>
      <table class="standings"><thead><tr>
        <th>#</th><th>Equipo</th><th>Pts</th><th>Sets</th>
      </tr></thead><tbody>`;
    general.forEach((r,i)=>{
      html += `<tr><td>${i+1}</td><td class="team">${escapeHtml(r.team)}</td><td class="pts">${r.pts}</td><td>${r.sg}-${r.sp}</td></tr>`;
    });
    html += `</tbody></table></div>`;
    html += `<p class="info-note"><b>Cómo se arma:</b> la clasificación general junta los 3 grupos ordenando primero a los 3 punteros entre sí, luego a los 3 segundos, y así. Con eso se arman las llaves Oro (1°-4°), Plata (5°-8°) y Bronce (9°-12°) a ida y vuelta.</p>`;
  }
  if(cat.hasMini){
    html += `<p class="info-note">Tabla única de 6 equipos, todos contra todos. Los puestos 1° a 6° arman directamente la final, el 3er/4to lugar y la definición de 5° y 6°.</p>`;
  }
  html += `<p class="info-note">Puntos por partido: 3 (gana 2-0) · 2 (gana 2-1) · 1 (pierde 1-2) · 0 (pierde 0-2). PJ partidos jugados, G ganados, P perdidos, SG/SP sets a favor/en contra.</p>`;

  contentEl.innerHTML = html;
}

function renderFixture(cat, ctx){
  const days = [...new Set(cat.matches.map(m=>m.day))];
  let html='';
  days.forEach(day=>{
    html += `<div class="day-block"><div class="day-title">${day}</div>`;
    cat.matches.filter(m=>m.day===day).forEach(m=>{
      html += matchCard(cat, m, ctx);
    });
    html += `</div>`;
  });
  contentEl.innerHTML = html;
  wireInputs(cat, ctx);
}

function renderLlaves(cat, ctx){
  const llaveMatches = cat.matches.filter(m=>m.phase==='llave');
  const days = [...new Set(llaveMatches.map(m=>m.day))];
  let html='';
  days.forEach(day=>{
    html += `<div class="day-block"><div class="day-title">${day}</div>`;
    llaveMatches.filter(m=>m.day===day).forEach(m=>{
      html += matchCard(cat, m, ctx);
    });
    html += `</div>`;
  });
  if(!llaveMatches.length) html = '<p class="info-note">Esta categoría no tiene fase de llaves.</p>';
  contentEl.innerHTML = html;
  wireInputs(cat, ctx);
}

function setRowHtml(matchId, setKey, setLabel, maxPts){
  const s = (scores[matchId] && scores[matchId][setKey]) || {};
  const hVal = s.h!=null ? s.h : '';
  const aVal = s.a!=null ? s.a : '';
  const w = setWinner(s);
  return `<div class="set-row">
    <span class="set-label">${setLabel}<span class="set-max">a ${maxPts}</span></span>
    <input type="number" min="0" class="score-input ${w==='h'?'set-won':''}" data-match="${matchId}" data-set="${setKey}" data-side="h" value="${hVal}" placeholder="-">
    <span class="vs-label">–</span>
    <input type="number" min="0" class="score-input ${w==='a'?'set-won':''}" data-match="${matchId}" data-set="${setKey}" data-side="a" value="${aVal}" placeholder="-">
  </div>`;
}

function matchCard(cat, m, ctx){
  const homeR = resolveSlot(cat, m.home, ctx);
  const awayR = resolveSlot(cat, m.away, ctx);
  const res = matchResult(m.id);
  const winnerH = res && res.winner==='h';
  const winnerA = res && res.winner==='a';
  const copaChip = m.copa ? `<span class="copa-chip copa-${m.copa}">${cap(m.copa)}</span>` : '';
  const label = m.label ? `<span style="color:var(--muted); font-size:11px;">${escapeHtml(m.label)}</span>` : '';

  // set 3 solo si viene 1-1 (o si ya se cargó algo en set3)
  const s = scores[m.id] || {};
  const w1 = setWinner(s.s1), w2 = setWinner(s.s2);
  const oneOne = (w1 && w2 && w1!==w2);
  const hasSet3Data = s.s3 && (s.s3.h!=='' && s.s3.h!=null || s.s3.a!=='' && s.s3.a!=null);
  const showSet3 = oneOne || hasSet3Data;

  const resultTag = res ? `<span class="result-tag">${res.hSets}-${res.aSets}</span>` : '';

  return `<div class="match-card">
    <div class="match-meta">
      <span class="time">${m.time}</span>
      <span class="court-tag">${m.court}</span>
      ${copaChip}
      ${resultTag}
    </div>
    ${label?`<div style="margin-bottom:6px;">${label}</div>`:''}
    <div class="teams-header">
      <div class="team-name ${!homeR.known?'placeholder':''} ${winnerH?'winner':''}">${escapeHtml(homeR.name)}</div>
      <span class="vs-mid">vs</span>
      <div class="team-name ${!awayR.known?'placeholder':''} ${winnerA?'winner':''}" style="text-align:right;">${escapeHtml(awayR.name)}</div>
    </div>
    <div class="sets-block">
      ${setRowHtml(m.id,'s1','Set 1',25)}
      ${setRowHtml(m.id,'s2','Set 2',25)}
      ${showSet3 ? setRowHtml(m.id,'s3','Set 3',15) : ''}
    </div>
    ${(!homeR.known || !awayR.known) ? `<div class="pending-tag">Se completa automáticamente cuando estén los resultados previos</div>`:''}
  </div>`;
}

function wireInputs(cat, ctx){
  contentEl.querySelectorAll('.score-input').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const matchId = e.target.dataset.match;
      const setKey = e.target.dataset.set;
      const side = e.target.dataset.side;
      const cur = (scores[matchId] && scores[matchId][setKey]) || {h:'',a:''};
      const v = e.target.value;
      const next = {...cur, [side]: v===''? '' : Number(v)};
      await saveSet(matchId, setKey, next.h, next.a);
      render();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ---------- INIT ----------
(function init(){
  contentEl.innerHTML = '<p class="info-note">Conectando…</p>';
  startRealtimeSync();
  render();
})();
</script>
</body>
</html>
